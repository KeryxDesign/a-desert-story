<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sfoglia l'estratto — A Desert Story</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="/consent/consent.css">
<style>
  :root{--bordeaux-ink:#2A1A12;--bordeaux-reader:#7B1E1E;--gold:#C9A24B;--cream:#F4ECD8;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bordeaux-reader);font-family:"Mulish",system-ui,sans-serif;}
  /* Colonna del lettore: il PDF e' 100x150 mm, a pagina intera resta stretto.
     Incassato in 520px centrati, con il bordeaux attorno. */
  .shell{max-width:520px;width:100%;height:100vh;height:100svh;margin:0 auto;
    display:flex;flex-direction:column;background:var(--bordeaux-ink);
    box-shadow:0 0 44px rgba(0,0,0,.35);}
  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--bordeaux-ink);border-bottom:1px solid rgba(201,162,75,.28);padding:9px 14px;min-height:54px;}
  .topbar .back{display:inline-flex;align-items:center;gap:7px;color:var(--cream);text-decoration:none;font-weight:600;font-size:.9rem;opacity:.9;white-space:nowrap;}
  .topbar .back:hover{color:var(--gold);opacity:1;}
  .topbar .brand{font-family:"Cinzel Decorative",serif;font-weight:700;color:var(--gold);font-size:.95rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .dl{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--bordeaux-ink);font-weight:700;font-size:.85rem;text-decoration:none;padding:8px 15px;border-radius:7px;white-space:nowrap;}
  .topbar .dl:hover{background:#d9b45f;}
  .reader{flex:1 1 auto;border:0;width:100%;display:block;background:var(--bordeaux-reader);}
  @media (max-width:520px){ .topbar .brand{display:none;} }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="back" href="../index.html" aria-label="Torna all'estratto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Torna all'estratto
      </a>
      <span class="brand">A Desert Story</span>
      <a class="dl" href="../../download/A-Desert-Story_Estratto.pdf?v=3" download="A Desert Story - Estratto.pdf">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
        Scarica
      </a>
    </div>
    <iframe class="reader" title="A Desert Story — estratto"
      src="../../pdfjs/web/viewer.html?file=..%2F..%2Fdownload%2FA-Desert-Story_Estratto.pdf%3Fv%3D3#zoom=page-fit&amp;scrollMode=0&amp;spreadMode=0"></iframe>
  </div>
<script src="/consent/consent.js"></script>
</body>
</html>
